name: Go CI Pipeline 🏎️

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-benchmark:
    name: Run Unit, Race Tests & Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.18", "1.21", "1.22"] # Tests compatibility across Go version baselines

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true # Speeds up consecutive builds by caching dependencies

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests with Race Detector 🛡️
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Verify Benchmarks 📊
        run: go test -bench=. -benchmem -benchtime=1x ./...
