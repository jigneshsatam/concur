name: golangci-lint
on:
  push:
    branches: [main, js/slice-processing]
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
